* {

    box-sizing: border-box;

body {

.container {

    max-width: 1000px;

}

.hero {
    text-align: center;

}

.hero small {
    color: #ed1b35;
    font-size: 13px;
    font-weight: 700;

}

.hero h1 {
    font-size: clamp(55px, 10vw, 95px);

    margin: 12px 0;
    letter-spacing: -3px;
}

.hero h1 span {
    color: #ed1b35;
}

.hero p {
    color: #777;
    font-size: 15px;
}

/* TITLE */

.section-title {
    text-align: center;
    font-size: 27px;
    font-weight: 800;
    margin-bottom: 30px;
}

.section-title span {
    color: #ed1b35;
}

/* IP CARDS */

.ip-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.ip-card {
    background: #111;
    border: 1px solid #242424;
    border-radius: 12px;
    padding: 28px;
    transition: border-color .25s;
}

.ip-card:hover {
    border-color: #ed1b35;
}

.ip-card h3 {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 18px;
}

.ip-address {
    background: #090909;
    border: 1px solid #262626;
    border-radius: 7px;
    padding: 13px;
    text-align: center;
    direction: ltr;
    color: #aaa;
    margin-bottom: 15px;
    font-size: 14px;
}

.copy-btn {
    width: 100%;
    background: #ed1b35;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.copy-btn:hover {
    background: #ff334d;
}

.private {

    font-weight: 700;
    transition: .2s;
}

.private-btn:hover {
    background: #ff334d;

/* FOOTER */

footer {

    padding: 25px;
    color: #555;
    font-size: 12px;
}

/* MOBILE */

@media(max-width: 650px) {
